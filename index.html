
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .todo-container {
            width: 100%;
            max-width: 550px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #taskInput {
            flex: 1;
            min-width: 0;
            padding: 13px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
        }

        #taskInput:focus {
            border-color: #667eea;
        }

        #addBtn {
            padding: 13px 20px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #addBtn:hover {
            background: #5568d8;
        }

        #taskList {
            list-style: none;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            margin-bottom: 10px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .task span {
            flex: 1;
            word-break: break-word;
            color: #333;
        }

        .task.completed span {
            text-decoration: line-through;
            color: #888;
        }

        .delete-btn {
            border: none;
            background: #ff4d4d;
            color: white;
            padding: 7px 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #e63939;
        }

        .task-count {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        /* Tablet */
        @media (max-width: 768px) {
            .todo-container {
                max-width: 500px;
                padding: 25px;
            }

            h1 {
                font-size: 28px;
            }
        }

        /* Mobile */
        @media (max-width: 480px) {
            body {
                padding: 12px;
                align-items: flex-start;
                padding-top: 40px;
            }

            .todo-container {
                padding: 20px;
                border-radius: 12px;
            }

            h1 {
                font-size: 24px;
                margin-bottom: 20px;
            }

            .input-section {
                flex-direction: column;
            }

            #taskInput,
            #addBtn {
                width: 100%;
            }

            #addBtn {
                padding: 12px;
            }

            .task {
                padding: 10px;
            }

            .delete-btn {
                padding: 6px 8px;
            }
        }
    </style>
</head>

<body>

    <div class="todo-container">

        <h1>My Todo List</h1>

        <div class="input-section">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
            >

            <button id="addBtn">Add</button>
        </div>

        <ul id="taskList"></ul>

        <div class="task-count">
            Tasks: <span id="taskCount">0</span>
        </div>

    </div>

    <script>
        const taskInput = document.getElementById("taskInput");
        const addBtn = document.getElementById("addBtn");
        const taskList = document.getElementById("taskList");
        const taskCount = document.getElementById("taskCount");

        function addTask() {
            const taskText = taskInput.value.trim();

            if (taskText === "") {
                alert("Please enter a task!");
                return;
            }

            const li = document.createElement("li");
            li.className = "task";

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";

            const span = document.createElement("span");
            span.textContent = taskText;

            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "Delete";
            deleteBtn.className = "delete-btn";

            checkbox.addEventListener("change", function () {
                li.classList.toggle("completed", checkbox.checked);
            });

            deleteBtn.addEventListener("click", function () {
                li.remove();
                updateCount();
            });

            li.appendChild(checkbox);
            li.appendChild(span);
            li.appendChild(deleteBtn);

            taskList.appendChild(li);

            taskInput.value = "";
            taskInput.focus();

            updateCount();
        }

        function updateCount() {
            taskCount.textContent = taskList.children.length;
        }

        addBtn.addEventListener("click", addTask);

        taskInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                addTask();
            }
        });
    </script>

</body>
</html>
